name: Build and Release

on:
push:
tags:
- 'v*.*.*'

workflow_dispatch:
inputs:
version:
description: 'Version number (e.g., 1.0.0)'
required: true
default: '1.0.0'

env:
FLUTTER_VERSION: '3.16.9'

jobs:

# ============================================

# Build Windows Application

# ============================================

build-windows:
name: Build Windows
runs-on: windows-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v7

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version: ${{ env.FLUTTER_VERSION }}
      channel: stable
      cache: true

  - name: Get dependencies
    run: flutter pub get

  - name: Enable Windows Desktop Support
    run: flutter create . --platforms=windows --project-name flutter_iptv

  - name: Build Windows Release
    run: flutter build windows --release

  - name: Create Windows Installer Package
    shell: pwsh
    run: |
      New-Item -ItemType Directory -Force -Path "dist/windows" | Out-Null

      Copy-Item `
        -Path "build/windows/x64/runner/Release/*" `
        -Destination "dist/windows/" `
        -Recurse `
        -Force

      Compress-Archive `
        -Path "dist/windows/*" `
        -DestinationPath "flutteriptv-Windows-x64.zip" `
        -Force

  - name: Upload Windows Artifact
    uses: actions/upload-artifact@v6
    with:
      name: windows-release
      path: flutteriptv-Windows-x64.zip
      retention-days: 5
```

# ============================================

# Build Android Mobile APK

# ============================================

build-android-mobile:
name: Build Android Mobile
runs-on: ubuntu-latest


steps:
  - name: Checkout repository
    uses: actions/checkout@v7

  - name: Setup Java
    uses: actions/setup-java@v6
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version: ${{ env.FLUTTER_VERSION }}
      channel: stable
      cache: true

  - name: Get dependencies
    run: flutter pub get

  - name: Build Android APK (Split by ABI)
    run: flutter build apk --release --split-per-abi

  - name: Rename APKs for Mobile
    shell: bash
    run: |
      mkdir -p dist/android-mobile

      cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
        dist/android-mobile/flutteriptv-Android-Mobile-armeabi-v7a.apk

      cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
        dist/android-mobile/flutteriptv-Android-Mobile-arm64-v8a.apk

      cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
        dist/android-mobile/flutteriptv-Android-Mobile-x86_64.apk

  - name: Build Universal APK
    run: flutter build apk --release

  - name: Copy Universal APK
    shell: bash
    run: |
      cp build/app/outputs/flutter-apk/app-release.apk \
        dist/android-mobile/flutteriptv-Android-Mobile-universal.apk

  - name: Upload Android Mobile Artifacts
    uses: actions/upload-artifact@v6
    with:
      name: android-mobile-release
      path: dist/android-mobile/
      retention-days: 5
```

# ============================================

# Build Android TV APK

# ============================================

build-android-tv:
name: Build Android TV
runs-on: ubuntu-latest


steps:
  - name: Checkout repository
    uses: actions/checkout@v7

  - name: Setup Java
    uses: actions/setup-java@v6
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version: ${{ env.FLUTTER_VERSION }}
      channel: stable
      cache: true

  - name: Get dependencies
    run: flutter pub get

  - name: Build Android TV APK
    run: |
      flutter build apk \
        --release \
        --dart-define=IS_TV=true \
        --split-per-abi

  - name: Rename APKs for TV
    shell: bash
    run: |
      mkdir -p dist/android-tv

      cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
        dist/android-tv/flutteriptv-AndroidTV-armeabi-v7a.apk

      cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
        dist/android-tv/flutteriptv-AndroidTV-arm64-v8a.apk

      cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
        dist/android-tv/flutteriptv-AndroidTV-x86_64.apk

  - name: Build Universal TV APK
    run: |
      flutter build apk \
        --release \
        --dart-define=IS_TV=true

  - name: Copy Universal TV APK
    shell: bash
    run: |
      cp build/app/outputs/flutter-apk/app-release.apk \
        dist/android-tv/flutteriptv-AndroidTV-universal.apk

  - name: Upload Android TV Artifacts
    uses: actions/upload-artifact@v6
    with:
      name: android-tv-release
      path: dist/android-tv/
      retention-days: 5
```

# ============================================

# Create GitHub Release

# ============================================

create-release:
name: Create Release


needs:
  - build-windows
  - build-android-mobile
  - build-android-tv

runs-on: ubuntu-latest

permissions:
  contents: write

steps:
  - name: Checkout repository
    uses: actions/checkout@v7

  - name: Download Windows Artifact
    uses: actions/download-artifact@v7
    with:
      name: windows-release
      path: ./release-assets/

  - name: Download Android Mobile Artifacts
    uses: actions/download-artifact@v7
    with:
      name: android-mobile-release
      path: ./release-assets/android-mobile/

  - name: Download Android TV Artifacts
    uses: actions/download-artifact@v7
    with:
      name: android-tv-release
      path: ./release-assets/android-tv/

  - name: Get version from tag or input
    id: version
    shell: bash
    run: |
      if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
        VERSION="${{ inputs.version }}"
        TAG="v${VERSION}"
      else
        TAG="${GITHUB_REF#refs/tags/}"
        VERSION="${TAG#v}"
      fi

      echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
      echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      echo "Version: ${VERSION}"
      echo "Tag: ${TAG}"

  - name: Generate Release Notes
    shell: bash
    run: |
      cat > release_notes.md << 'EOF'
      ## 📺 flutteriptv ${{ steps.version.outputs.VERSION }}

      ### 📥 Downloads

      #### Windows

      | File | Description |
      |------|-------------|
      | `flutteriptv-Windows-x64.zip` | Windows 64-bit portable application |

      #### Android Mobile

      | File | Description |
      |------|-------------|
      | `flutteriptv-Android-Mobile-arm64-v8a.apk` | 64-bit ARM devices |
      | `flutteriptv-Android-Mobile-armeabi-v7a.apk` | 32-bit ARM devices |
      | `flutteriptv-Android-Mobile-x86_64.apk` | x86_64 devices/emulators |
      | `flutteriptv-Android-Mobile-universal.apk` | Universal APK |

      #### Android TV

      | File | Description |
      |------|-------------|
      | `flutteriptv-AndroidTV-arm64-v8a.apk` | 64-bit ARM TV devices |
      | `flutteriptv-AndroidTV-armeabi-v7a.apk` | 32-bit ARM TV devices |
      | `flutteriptv-AndroidTV-x86_64.apk` | x86_64 TV devices/emulators |
      | `flutteriptv-AndroidTV-universal.apk` | Universal TV APK |

      ### ✨ Features

      - M3U/M3U8 playlist support
      - HLS, DASH and RTMP playback
      - Channel grouping and favorites
      - Full D-Pad navigation for Android TV
      - Dark theme optimized for TV viewing

      ### 📋 Installation

      **Windows**

      1. Download `flutteriptv-Windows-x64.zip`
      2. Extract the ZIP
      3. Run `flutter_iptv.exe`

      **Android Mobile**

      1. Download the APK matching your device
      2. Install the APK
      3. Launch the application

      **Android TV**

      1. Download the appropriate APK
      2. Install via USB, ADB or a file manager
      3. Launch from the TV app drawer

      ---

      > 💡 ARM64 devices should normally use the `arm64-v8a` APK.
      EOF

  - name: Create GitHub Release
    uses: softprops/action-gh-release@v3
    with:
      tag_name: ${{ steps.version.outputs.TAG }}
      name: flutteriptv ${{ steps.version.outputs.VERSION }}
      body_path: release_notes.md
      draft: false
      prerelease: false
      files: |
        release-assets/flutteriptv-Windows-x64.zip
        release-assets/android-mobile/flutteriptv-Android-Mobile-arm64-v8a.apk
        release-assets/android-mobile/flutteriptv-Android-Mobile-armeabi-v7a.apk
        release-assets/android-mobile/flutteriptv-Android-Mobile-x86_64.apk
        release-assets/android-mobile/flutteriptv-Android-Mobile-universal.apk
        release-assets/android-tv/flutteriptv-AndroidTV-arm64-v8a.apk
        release-assets/android-tv/flutteriptv-AndroidTV-armeabi-v7a.apk
        release-assets/android-tv/flutteriptv-AndroidTV-x86_64.apk
        release-assets/android-tv/flutteriptv-AndroidTV-universal.apk
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

